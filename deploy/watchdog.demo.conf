# Services the watchdog keeps alive (revive only): name|port|health_path|cwd|command
# = the captain's stable demo as it runs on 14 Nov 12:05 (ps). (The password gate, deploy/gate.py, is no longer needed:
# captain 12:52, Stoa tests on the captain's laptop. To use it again add:
# gate|8190|/__gate/health|<dir with gate.py>|exec python gate.py --upstream http://127.0.0.1:5180 --port 8190 --password-file $HOME/.stoa_gate)
# A revived service inherits the watchdog's environment (API keys, STOA_DATA, JUNCTION_SHARED, LLM_BASE_URL ...).
api|8100|/health|/path/to/repo|STOA_TEXT_BACKEND=local2 exec .venv/bin/python -m uvicorn stoa.api:app --host 127.0.0.1 --port 8100
web|5180|/|/path/to/repo/web|STOA_API_URL=http://127.0.0.1:8100 STOA_TEXT_BACKEND=local2 exec node node_modules/vite/bin/vite.js preview --port 5180 --strictPort --outDir .stoa/captain-demo/web
# End-to-end probes every 5 min (log only): probe|label|url|json body (empty = GET)|text the reply must contain.
# The API probe asks a guided-tour question (answered from the IFC model, 0 model calls; cached after the first time).
probe|api-ask|http://127.0.0.1:8100/ask|{"path": "data/ifc_models/bsc-esplanades_1807-ep-ar-v18_plan-01-1-korrus.pdf", "question": "How many doors are on this floor?"}|"value":46
probe|web-to-api|http://127.0.0.1:5180/api/health||"ok":true
